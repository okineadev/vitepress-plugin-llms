name: Tests

on:
  workflow_call:
    inputs:
      run-on-windows:
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Tests
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ${{ inputs.run-on-windows && 'windows-latest' || '' }}
        exclude:
          - os: ''

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # Download only the necessary files
          sparse-checkout: |
            patches/
            src/
            tests/
            .gitignore
            tsdown.config.ts
            package.json
            .oxfmtrc.json
            oxlint.config.ts
            bun.lock
            bunfig.toml
            cspell.yml
            tsconfig*.json
            !**/*.md
            tests/test-assets/*.md

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      # Run only on Windows because on Linux there are no problems with slow package installation
      - name: 📥 Cache Bun dependencies (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6.1.0
        with:
          path: ~\.bun
          key: ${{ matrix.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ matrix.os }}-bun-cache-

      - name: 📦 Install dependencies
        run: bun ci --prefer-offline --ignore-scripts

      - name: 🗞️ Lint
        run: |
          bun run lint
          bun run format:check

      - name: 🗞️ Run Woke linter
        uses: get-woke/woke-action@v0
        with:
          # Cause the check to fail on any broke rules
          fail-on-error: true

      - name: 🧪 Run tests
        run: bun run test
