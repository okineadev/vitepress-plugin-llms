name: 👷‍♂️ Update Dependents Info

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  dependents:
    name: 👷‍♂️ Update dependents.info
    runs-on: ubuntu-slim
    permissions:
      id-token: write # Needed for https://dependents.info
    steps:
      - uses: gouravkhunger/dependents.info@0.1.5
        with:
          exclude-users: koel
          max-pages: 100
